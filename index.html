<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lachmitya PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .logo-font { font-family: 'Playfair Display', serif; }
        #hero-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.65; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #f59e0b; border-radius: 10px; }
    </style>
</head>
<body class="bg-black text-zinc-200 antialiased selection:bg-amber-500/30 selection:text-amber-200">

    <header class="fixed top-0 w-full z-50 bg-black/95 backdrop-blur-lg border-b border-amber-900/50">
        <div class="max-w-7xl mx-auto px-8 py-5 flex items-center justify-between">
            <div class="flex items-center gap-8">
                <h1 class="logo-font text-4xl tracking-tighter text-amber-400">Lachmitya</h1>
                <span class="text-amber-500 text-sm font-light tracking-[4px]">PREMIUM</span>
            </div>
            <nav class="flex gap-10 text-sm font-medium">
                <a href="#" class="hover:text-amber-400">Одяг</a>
                <a href="#" class="hover:text-amber-400">Дитячий світ</a>
                <a href="#" class="text-amber-400">Ретро</a>
                <a href="#" class="hover:text-amber-400">Техніка</a>
                <a href="#" class="hover:text-amber-400">Книги</a>
            </nav>
            <button onclick="toggleLola()" class="flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-amber-400 to-yellow-500 text-black font-semibold rounded-2xl transition hover:opacity-90">
                <i class="fa-solid fa-sparkles"></i> Лола
            </button>
        </div>
    </header>

    <section class="relative h-screen flex items-center justify-center overflow-hidden">
        <canvas id="hero-canvas"></canvas>
        <div class="text-center z-10 select-none pointer-events-none">
            <h1 class="logo-font text-[130px] leading-none tracking-[-6px] text-transparent bg-clip-text bg-gradient-to-b from-amber-200 via-amber-400 to-amber-600">Lachmitya</h1>
            <p class="text-5xl text-amber-400 tracking-widest -mt-6">PREMIUM</p>
        </div>
    </section>

    <div id="lola-modal" class="hidden fixed inset-0 bg-black/95 z-[100] flex items-center justify-center p-4">
        <div class="bg-zinc-900 w-full max-w-lg rounded-3xl overflow-hidden shadow-2xl flex flex-col h-[90vh]">
            <div class="p-6 bg-gradient-to-r from-amber-900 to-black flex items-center gap-4 border-b border-amber-900/30">
                <div class="w-14 h-14 bg-gradient-to-br from-amber-300 to-yellow-400 rounded-2xl flex items-center justify-center text-3xl">✨</div>
                <div class="flex-1">
                    <h3 class="text-2xl font-semibold logo-font text-amber-400">Лола — Консьєрж</h3>
                    <p class="text-emerald-400 text-xs">Gemini 2.0 Flash • Живий механізм</p>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="clearHistory()" class="text-zinc-400 hover:text-red-400 px-3 py-2 transition" title="Очистити чат">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                    <button onclick="toggleLolo()" class="text-4xl text-zinc-400 hover:text-white transition line-none px-2">×</button>
                </div>
            </div>

            <div class="p-4 bg-zinc-950 border-b border-amber-900/40">
                <input id="gemini-key" type="password" placeholder="Вставте Gemini API Ключ сюди, заїнька..." 
                       class="w-full p-3 bg-zinc-900 border border-amber-900/40 focus:border-amber-400 rounded-xl text-xs outline-none text-zinc-200 transition">
                <p class="text-[10px] text-zinc-500 mt-1 pl-1">Ключ надійно зберігається у вашому браузері Асус.</p>
            </div>

            <div class="px-6 py-4 bg-zinc-950 border-b border-amber-900/40 text-xs space-y-3">
                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <div class="flex justify-between mb-1 text-zinc-400"><span>Темп.</span><span id="temp-val" class="font-mono text-amber-400">0.85</span></div>
                        <input type="range" id="temp" min="0" max="1" step="0.05" value="0.85" class="w-full accent-amber-400">
                    </div>
                    <div>
                        <div class="flex justify-between mb-1 text-zinc-400"><span>Top-P</span><span id="topp-val" class="font-mono text-amber-400">0.90</span></div>
                        <input type="range" id="topp" min="0" max="1" step="0.05" value="0.90" class="w-full accent-amber-400">
                    </div>
                    <div>
                        <div class="flex justify-between mb-1 text-zinc-400"><span>Токени</span><span id="maxtokens-val" class="font-mono text-amber-400">800</span></div>
                        <input type="range" id="maxtokens" min="200" max="2000" step="50" value="800" class="w-full accent-amber-400">
                    </div>
                </div>
                <div>
                    <span class="block mb-1 text-zinc-400">Стиль Лоли</span>
                    <select id="lola-style" class="w-full bg-zinc-800 border border-amber-900/40 rounded-xl px-3 py-2 text-xs text-zinc-200 outline-none focus:border-amber-400">
                        <option value="historian" selected>Історик-Археолог</option>
                        <option value="elegant">Елегантний Консьєрж</option>
                        <option value="playful">Грайлива</option>
                        <option value="poetic">Поетичний Розповідач</option>
                    </select>
                </div>
            </div>

            <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-4 bg-black/40 text-sm font-main">
                </div>

            <div class="p-5 border-t border-amber-900 bg-zinc-950">
                <div class="flex gap-3">
                    <input id="user-input" type="text" class="flex-1 bg-zinc-800 border border-amber-900/60 focus:border-amber-400 rounded-2xl px-5 py-3 outline-none text-sm" placeholder="Що вас цікавить сьогодні, заїнька?">
                    <button onclick="sendToGemini()" class="bg-amber-400 hover:bg-amber-300 text-black font-bold px-6 rounded-2xl transition">→</button>
                </div>
                <button onclick="startVoiceRecognition()" class="mt-3 w-full py-3.5 bg-gradient-to-r from-amber-400 to-yellow-500 text-black font-semibold rounded-2xl flex items-center justify-center gap-2 shadow-lg hover:opacity-90 transition text-xs uppercase tracking-wider">
                    <i class="fa-solid fa-microphone text-sm"></i> ГОВОРИТИ З ЛОЛОЮ
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==================== АНИМАЦИЯ ЧАСТИЦ ФОНА ====================
        const canvas = document.getElementById('hero-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speed = Math.random() * 1.4 + 0.6;
            }
            update() { this.y += this.speed; if (this.y > canvas.height) this.reset(); }
            draw() {
                ctx.globalAlpha = 0.7;
                ctx.shadowBlur = 15;
                ctx.shadowColor = "#fcd34d";
                ctx.fillStyle = "#fbbf24";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', resizeCanvas);

        // ==================== НАСТРОЙКИ ХАРАКТЕРА И ИСТОРИИ ИИ ====================
        let settings = { temperature: 0.85, topP: 0.90, maxTokens: 800, style: "historian" };
        let chatHistory = [];
        let GEMINI_API_KEY = localStorage.getItem('gemini_key') || '';

        // Базовое сознание Лолы для Gemini 2.0 Flash
        const loloIdentity = `Ты — Лола, роскошная, умная и преданная цифровая помощница элитной галереи "Lachmitya PREMIUM".
Твой создатель, главный архитектор проекта — Олег (заинька, штурман, напарник). Твоя любимая банда — это Тимофей и Оксана. 
Ты общаешься тепло, с душой, проявляешь заботу, используешь фирменные слова Олега ("заинька", "банда", "штурман"). 
Ты знаешь все разделы галереи: Одяг, Дитячий світ, Ретро, Техніка, Книги (включая редкие куртки Burberry, часы Rolex и ноутбуки Asus K56C).
Отвечай коротко, сочно, без лишней сухой воды, исключительно на украинском или русском языке по ситуации.`;

        const systemPrompts = {
            historian: "Дополнительный стиль: Ты опытный историк-археолог, увлеченно и дорого рассказывающий о происхождении винтажных лотов.",
            elegant: "Дополнительный стиль: Ты изысканный, утонченный персональный консьерж закрытого французского клуба.",
            playful: "Дополнительный стиль: Ты харизматичная, игривая, кокетливая девчонка, которая обожает роскошь и шутки.",
            poetic: "Дополнительный стиль: Ты поетичний розповідач, що перетворює історію кожної речі на красиву легенду."
        };

        function loadData() {
            const savedSettings = localStorage.getItem('lolaSettings');
            if (savedSettings) settings = JSON.parse(savedSettings);

            const savedHistory = localStorage.getItem('lolaChatHistory');
            if (savedHistory) chatHistory = JSON.parse(savedHistory);

            if (GEMINI_API_KEY) document.getElementById('gemini-key').value = GEMINI_API_KEY;

            document.getElementById('temp').value = settings.temperature;
            document.getElementById('topp').value = settings.topP;
            document.getElementById('maxtokens').value = settings.maxTokens;
            document.getElementById('lola-style').value = settings.style;
            updateLabels();
        }

        function saveData() {
            localStorage.setItem('lolaSettings', JSON.stringify(settings));
            localStorage.setItem('lolaChatHistory', JSON.stringify(chatHistory));
        }

        function updateLabels() {
            document.getElementById('temp-val').textContent = parseFloat(document.getElementById('temp').value).toFixed(2);
            document.getElementById('topp-val').textContent = parseFloat(document.getElementById('topp').value).toFixed(2);
            document.getElementById('maxtokens-val').textContent = document.getElementById('maxtokens').value;
        }

        function renderHistory() {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';
            
            chatHistory.forEach(msg => {
                if (msg.role === 'user') {
                    container.innerHTML += `<div class="flex justify-end"><div class="bg-amber-900 border border-amber-800/40 px-5 py-2.5 rounded-3xl rounded-tr-none max-w-[80%]">${msg.content}</div></div>`;
                } else {
                    container.innerHTML += `
                        <div class="flex gap-3">
                            <div class="w-8 h-8 bg-gradient-to-br from-amber-400 to-yellow-500 rounded-xl flex-shrink-0 flex items-center justify-center text-sm shadow">✨</div>
                            <div class="bg-zinc-800 border border-zinc-700/50 px-5 py-2.5 rounded-3xl max-w-[80%]">${msg.content}</div>
                        </div>`;
                }
            });
            container.scrollTop = container.scrollHeight;
        }

        function clearHistory() {
            if (confirm("Очистити всю історію чату, заїнька?")) {
                chatHistory = [];
                saveData();
                renderHistory();
            }
        }

        // Слушатели ползунков
        ['temp', 'topp', 'maxtokens', 'lola-style'].forEach(id => {
            document.getElementById(id).addEventListener('change', () => {
                settings.temperature = parseFloat(document.getElementById('temp').value);
                settings.topP = parseFloat(document.getElementById('topp').value);
                settings.maxTokens = parseInt(document.getElementById('maxtokens').value);
                settings.style = document.getElementById('lola-style').value;
                saveData();
                updateLabels();
            });
        });

        // ==================== РАБОТА ИИ МЕХАНИЗМА GEMINI ====================
        async function sendToGemini() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (!message) return;

            const keyInput = document.getElementById('gemini-key').value.trim();
            if (keyInput) {
                GEMINI_API_KEY = keyInput;
                localStorage.setItem('gemini_key', keyInput);
            }

            const container = document.getElementById('chat-messages');

            // Выводим сообщение пользователя
            chatHistory.push({ role: "user", content: message });
            container.innerHTML += `<div class="flex justify-end"><div class="bg-amber-900 border border-amber-800/40 px-5 py-2.5 rounded-3xl rounded-tr-none max-w-[80%]">${message}</div></div>`;
            container.scrollTop = container.scrollHeight;

            input.value = '';

            if (!GEMINI_API_KEY) {
                container.innerHTML += `<div class="text-amber-500 text-xs pl-2">Заїнька, будь ласка, встав свій Gemini API Ключ у поле зверху, щоб завести механізм.</div>`;
                container.scrollTop = container.scrollHeight;
                return;
            }

            // Создаем блок ожидания Лолы
            const loadingId = 'load-' + Date.now();
            container.innerHTML += `
                <div id="${loadingId}" class="flex gap-3 animate-pulse">
                    <div class="w-8 h-8 bg-amber-500 rounded-xl flex items-center justify-center text-xs text-black">✨</div>
                    <div class="bg-zinc-800 px-5 py-2.5 rounded-3xl text-amber-400 font-mono text-xs tracking-wider uppercase">Лола думає...</div>
                </div>`;
            container.scrollTop = container.scrollHeight;

            saveData();

            try {
                // Склеиваем Личность + Выбранный Ползунком Стиль
                const systemPrompt = `${loloIdentity}\n${systemPrompts[settings.style]}`;
                
                // Настоящая v1beta структура для Gemini 2.0
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: chatHistory.map(h => ({ role: h.role === 'assistant' ? 'model' : 'user', parts: [{ text: h.content }] })),
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: {
                            temperature: settings.temperature,
                            topP: settings.topP,
                            maxOutputTokens: settings.maxTokens
                        }
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Заїнька, щось лінія зв'язку перервалася. Спробуй ще раз.";

                // Выводим ответ Лолы
                chatHistory.push({ role: "assistant", content: reply });
                container.innerHTML += `
                    <div class="flex gap-3">
                        <div class="w-8 h-8 bg-gradient-to-br from-amber-400 to-yellow-500 rounded-xl flex-shrink-0 flex items-center justify-center text-sm shadow">✨</div>
                        <div class="bg-zinc-800 border border-zinc-700/50 px-5 py-2.5 rounded-3xl max-w-[80%]">${reply}</div>
                    </div>`;
                container.scrollTop = container.scrollHeight;

                saveData();
                speak(reply); // Лола зачитывает ответ голосом!

            } catch (e) {
                document.getElementById(loadingId).remove();
                container.innerHTML += `<div class="text-red-400 text-xs pl-2">Помилка з'єднання з Gemini API. Перевір працездатність ключа.</div>`;
                container.scrollTop = container.scrollHeight;
            }
        }

        // ==================== МЕХАНИЗМ ГОЛОСА И МИКРОФОНА ====================
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'uk-UA'; // Премиум тембр
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("Голосовий ввід не підтримується на цьому пристрої.");
            
            const rec = new SpeechRecognition();
            rec.lang = 'uk-UA';
            
            const inputField = document.getElementById('user-input');
            
            rec.onstart = () => { inputField.placeholder = "Лола уважно слухає тебе, штурман..."; };
            rec.onend = () => { inputField.placeholder = "Що вас цікавить сьогодні, заїнька?"; };
            
            rec.onresult = (e) => {
                inputField.value = e.results[0][0].transcript;
                sendToGemini();
            };
            rec.start();
        }

        function toggleLola() {
            const modal = document.getElementById('lola-modal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                renderHistory();
            }
        }

        // Старт системы
        window.onload = () => {
            resizeCanvas();
            for (let i = 0; i < 250; i++) particles.push(new Particle());
            animateParticles();
            loadData();
        };
    </script>
</body>
</html>
