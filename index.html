<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Lachmitya PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white">
    <div id="chat-container" class="max-w-md mx-auto mt-20 p-6 bg-zinc-900 rounded-3xl">
        <div id="messages" class="h-64 overflow-y-auto mb-4 border-b border-amber-900"></div>
        <input id="user-input" class="w-full p-3 bg-zinc-800 rounded-xl outline-none" placeholder="Що вас цікавить?">
        <button onclick="send()" class="w-full mt-2 p-3 bg-amber-500 rounded-xl text-black font-bold">Надіслати</button>
    </div>

    <script>
        async function send() {
            const input = document.getElementById('user-input');
            const msg = input.value;
            const API_KEY = "ВСТАВ_СЮДИ_API_KEY"; 
            
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: [{ parts: [{ text: msg }] }] })
            });
            const data = await res.json();
            document.getElementById('messages').innerHTML += `<p>Лола: ${data.candidates[0].content.parts[0].text}</p>`;
            input.value = '';
        }
    </script>
</body>
</html>
