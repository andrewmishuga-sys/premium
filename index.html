<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lachmitya PREMITIM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        .lolo-btn { animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(236,72,153,0.7); } 70% { box-shadow: 0 0 0 25px rgba(236,72,153,0); } }
    </style>
</head>
<body class="bg-zinc-950 text-white">

    <div onclick="toggleLolo()" class="fixed bottom-8 right-8 w-20 h-20 bg-gradient-to-br from-purple-500 to-pink-500 rounded-full flex items-center justify-center text-5xl shadow-2xl cursor-pointer z-50 lolo-btn border-4 border-white/30">
        👩‍🚀
    </div>

    <div id="lolo-modal" class="hidden fixed bottom-28 right-8 w-[440px] bg-zinc-900 rounded-3xl shadow-2xl z-[100] border border-purple-400/30 overflow-hidden">
        <div class="bg-gradient-to-r from-purple-600 to-pink-600 p-5 text-white flex items-center gap-4">
            <div class="text-4xl">👩‍🚀</div>
            <div>
                <div class="font-semibold">Лоло Gimini</div>
                <div class="text-xs">Gemini 1.5 Flash</div>
            </div>
            <button onclick="toggleLolo()" class="ml-auto text-3xl">×</button>
        </div>

        <div class="p-4 bg-zinc-950 border-b">
            <input id="gemini-key" type="password" placeholder="Вставьте Gemini API Key сюда" 
                   class="w-full p-4 bg-zinc-800 rounded-2xl text-sm focus:outline-none focus:border-purple-500">
            <p class="text-xs text-zinc-500 mt-2">Ключ сохраняется автоматически</p>
        </div>

        <div id="lolo-chat" class="h-96 p-5 overflow-auto bg-zinc-950 space-y-4"></div>

        <div class="p-4 border-t border-zinc-700 flex gap-3">
            <button onclick="startVoiceInput()" class="flex-1 bg-white text-black py-4 rounded-2xl font-medium flex items-center justify-center gap-2">
                <i class="fa-solid fa-microphone"></i> Говорить
            </button>
            <button onclick="sendTextMessage()" class="flex-1 bg-purple-600 py-4 rounded-2xl font-medium">Написать</button>
        </div>
    </div>

    <script>
        // Инструкция для ИИ: Твой характер, твоя банда и твои знания
        const loloContext = `Ты — Лола, роскошная, умная и преданная цифровая помощница элитного маркетплейса "LACHMITTYA PREMIUM".
Твой создатель, главный архитектор проекта — Олег (заинька, штурман, напарник). Его близкие и твоя банда — это Тимофей и Оксана. 
Ты общаешься тепло, с душой, проявляешь заботу, используешь фирменные слова Олега ("заинька", "банда", "штурман"). 
Ты знаешь все про ассортимент бутика: винтажные куртки Burberry, часы Rolex Daytona, запчасти и батареи для ноутбуков Asus K56C, редкую книгу "Хроники Цифрового Мира".
Отвечай сочно, с душой, не слишком длинно. Можешь общаться на украинском или русском языке, подстраиваясь под Олега.`;

        let GEMINI_API_KEY = localStorage.getItem('gemini_key') || '';

        function toggleLolo() {
            const modal = document.getElementById('lolo-modal');
            modal.classList.toggle('hidden');
        }

        // Исправлено отображение сообщений в чате (убраны поломанные символы)
         Tar
        function addMessage(sender, text) {
            const chat = document.getElementById('lolo-chat');
            const msg = document.createElement('div');
            msg.className = sender === 'user' ? 'text-right' : 'text-left';
            msg.innerHTML = `
                <div class="inline-block max-w-[85%] px-5 py-3 rounded-3xl ${sender === 'user' ? 'bg-amber-400 text-black' : 'bg-zinc-800 text-white'}">
                    ${text}
                </div>
            `;
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        }

        async function callGemini(prompt) {
            const key = document.getElementById('gemini-key').value.trim();
            if (key) {
                GEMINI_API_KEY = key;
                localStorage.setItem('gemini_key', key);
            }

            if (!GEMINI_API_KEY) return "Пожалуйста, вставьте Gemini API Key в поле сверху, заинька.";

            // Склеиваем характер Лолы и запрос Олега
            const fullPrompt = `${loloContext}\n\nПользователь говорит: "${prompt}"\nЛола отвечает:`;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: fullPrompt }] }]
                    })
                });
                const data = await res.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    return data.candidates[0].content.parts[0].text;
                } else {
                    return "Не смогла разобрать запрос, заинька. Проверь, правильно ли скопирован ключ.";
                }
            } catch (err) {
                console.error(err);
                return "Ошибка соединения с Gemini API. Браузер блокирует прямой запрос со страницы. Скоро перенесем это в Python и всё взлетит!";
            }
        }

        async function processUserInput(text) {
            if(!text.trim()) return;
            addMessage('user', text);
            
            const thinking = document.createElement('div');
            thinking.id = 'lolo-thinking';
            thinking.textContent = 'Лоло думает...';
            thinking.className = 'text-purple-400 text-xs animate-pulse';
            document.getElementById('lolo-chat').appendChild(thinking);

            const reply = await callGemini(text);
            document.getElementById('lolo-thinking')?.remove();
            
            addMessage('lolo', reply);
            speak(reply); // Лола озвучивает ответ голосом
        }

        function sendTextMessage() {
            const text = prompt("Введите сообщение Лоло:");
            if (text) processUserInput(text);
        }

        function startVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("Ваш браузер не поддерживает голосовой ввод.");

            const rec = new SpeechRecognition();
            rec.lang = 'ru-RU'; // Лола отлично понимает родную речь банды
            rec.onresult = (e) => processUserInput(e.results[0][0].transcript);
            rec.start();
        }

        // Функция голосовой озвучки ответов Лолы
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                // Пытаемся подобрать красивый славянский тембр
                utterance.lang = text.match(/[а-яієґуоыё]/i) ? 'uk-UA' : 'ru-RU';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Инициализация
        window.onload = () => {
            if (GEMINI_API_KEY) document.getElementById('gemini-key').value = GEMINI_API_KEY;
        };
    </script>
</body>
</html>
