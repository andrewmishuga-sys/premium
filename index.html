<script>
    async function askLola(userPrompt) {
        const apiKey = "ВСТАВ_СЮДИ_СВІЙ_API_KEY"; // Твой ключ от Google AI Studio
        const chat = document.getElementById('lolo-chat'); 

        // Запрос к Gemini
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                contents: [{ parts: [{ text: `Ти Лола, помічниця Олега. Відповідь: ${userPrompt}` }] }]
            })
        });
        
        const data = await response.json();
        const reply = data.candidates[0].content.parts[0].text;
        
        // Вывод ответа (подставь свой ID элемента чата)
        chat.innerHTML += `<div class="p-2 border-b border-zinc-800">Лола: ${reply}</div>`;
        
        // Голос
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(reply));
    }
</script>
