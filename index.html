<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Lachmitya PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white">
    <div id="chat-window" class="fixed bottom-10 right-10 w-96 bg-zinc-900 p-6 rounded-3xl border border-amber-900">
        <div id="messages" class="h-64 overflow-y-auto mb-4 text-sm"></div>
        <input id="user-input" class="w-full bg-zinc-800 p-3 rounded-xl mb-2" placeholder="Запитай Лолу...">
        <button onclick="askGemini()" class="w-full bg-amber-500 py-3 rounded-xl font-bold text-black">Надіслати</button>
    </div>

    <script>
        async function askGemini() {
            const input = document.getElementById('user-input');
            const msg = input.value;
            // Сюда ты вставляешь свой ключ, он будет работать прямо из браузера
            const API_KEY = "ВСТАВ_СЮДИ_API_KEY"; 
            
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ contents: [{ parts: [{ text: "Ти Лола. Відповідь: " + msg }] }] })
            });
            const data = await res.json();
            document.getElementById('messages').innerHTML += `<p><b>Лола:</b> ${data.candidates[0].content.parts[0].text}</p>`;
            input.value = '';
        }
    </script>
</body>
</html>
