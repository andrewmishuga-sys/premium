<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lachmitya Premitim • Luxury</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .logo-font { font-family: 'Playfair Display', serif; }
        .gold { color: #d4af37; }
        .product-card { transition: all 0.4s ease; }
        .product-card:hover { transform: scale(1.05); }
    </style>
</head>
<body class="bg-zinc-950 text-white">

    <header class="fixed top-0 w-full bg-black/95 backdrop-blur-xl z-50 border-b border-zinc-800">
        <div class="max-w-7xl mx-auto px-8 py-5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 border border-amber-400 rounded-full flex items-center justify-center text-3xl logo-font">L</div>
                <span class="logo-font text-3xl gold">Lachmitya Premitim</span>
            </div>

            <nav class="flex gap-8 text-sm uppercase tracking-widest">
                <a href="#" class="hover:text-amber-400">Home</a>
                <a href="#" class="hover:text-amber-400">Shop</a>
                <a href="#" class="hover:text-amber-400">About</a>
                <a href="#" class="hover:text-amber-400">Contact</a>
            </nav>

            <div class="flex items-center gap-6">
                <div class="relative">
                    <input type="text" placeholder="Search" class="bg-zinc-900 border border-zinc-700 rounded-full px-5 py-2 w-72 text-sm focus:outline-none focus:border-amber-400">
                </div>
                <button onclick="toggleCart()" class="relative text-2xl">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-amber-400 text-black text-xs w-5 h-5 rounded-full flex items-center justify-center">0</span>
                </button>
                <button onclick="toggleLolo()" class="text-3xl">👩‍🚀</button>
            </div>
        </div>
    </header>

    <div class="pt-32 flex max-w-7xl mx-auto">
        <div class="w-72 border-r border-zinc-800 p-8 hidden lg:block">
            <h3 class="uppercase text-xs tracking-widest mb-6">Categories</h3>
            <div class="space-y-4 text-sm">
                <div class="cursor-pointer hover:text-amber-400">Handbags</div>
                <div class="cursor-pointer hover:text-amber-400">Totes</div>
                <div class="cursor-pointer hover:text-amber-400">Crossbody</div>
                <div class="cursor-pointer hover:text-amber-400">Clutches</div>
            </div>
        </div>

        <div class="flex-1 p-8">
            <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </div>
    </div>

    <div onclick="toggleLolo()" class="fixed bottom-8 right-8 w-20 h-20 bg-gradient-to-br from-purple-500 via-pink-500 to-amber-400 rounded-full flex items-center justify-center text-5xl shadow-2xl cursor-pointer z-[1000] border-4 border-white/30">
        👩‍🚀
    </div>

    <div id="lolo-modal" class="hidden fixed bottom-28 right-8 w-[440px] bg-zinc-900 rounded-3xl shadow-2xl z-[1100] border border-purple-400/30 overflow-hidden flex flex-col h-[520px]">
        <div class="bg-gradient-to-r from-purple-600 to-pink-600 p-6 flex items-center gap-4 text-white">
            <div class="text-4xl">👩‍🚀</div>
            <div class="flex-1">
                <div class="font-semibold">Лоло Gimini</div>
                <div class="text-xs">Gemini 1.5 Flash</div>
            </div>
            <button onclick="toggleLolo()" class="text-4xl">×</button>
        </div>

        <div class="p-4 bg-zinc-950 border-b border-zinc-800">
            <input id="gemini-key" type="password" placeholder="Вставьте ваш Gemini API Key сюда" class="w-full p-4 bg-zinc-800 rounded-2xl text-sm focus:outline-none focus:border-purple-500 text-white">
            <p class="text-[10px] text-zinc-500 mt-1.5 pl-1">Ключ сохраняется автоматически в вашем браузере Асус</p>
        </div>

        <div id="lolo-chat" class="flex-1 p-6 overflow-auto space-y-4 bg-zinc-950 text-sm">
            </div>

        <div class="p-4 border-t border-zinc-800 bg-zinc-900 flex gap-3">
            <button onclick="startVoiceInput()" class="flex-1 bg-white text-black py-4 rounded-2xl font-medium flex items-center justify-center gap-2 hover:bg-amber-400 transition">
                <i class="fa-solid fa-microphone"></i> Говорить
            </button>
            <button onclick="sendTextMessage()" class="flex-1 bg-purple-600 text-white py-4 rounded-2xl font-medium hover:bg-purple-700 transition">Написать</button>
        </div>
    </div>

    <script>
        // Контекст характера Лолы
        const loloContext = `Ты — Лола, роскошная, умная и преданная цифровая помощница элитного маркетплейса "Lachmitya Premitim".
Твой создатель, главный архитектор проекта — Олег (заинька, штурман, напарник). Его близкие и твоя банда — это Тимофей и Оксана. 
Ты общаешься тепло, с душой, проявляешь заботу, используешь фирменные слова Олега ("заинька", "банда", "штурман"). 
Ты знаешь все про ассортимент бутика: элитные сумки Louis Vuitton, Chanel, Hermès Birkin, а также другие эксклюзивные лоты банды.
Отвечай сочно, с душой, не слишком длинно, исключительно на русском или украинском языке по ситуации.`;

        let cart = [];
        let GEMINI_API_KEY = localStorage.getItem('gemini_key') || '';

        const products = [
            {id:1, title:"Louis Vuitton Neverfull MM", price:245000, img:"https://picsum.photos/id/1015/600/600"},
            {id:2, title:"Chanel Classic Flap Bag", price:385000, img:"https://picsum.photos/id/201/600/600"},
            {id:3, title:"Hermès Birkin 25", price:1240000, img:"https://picsum.photos/id/180/600/600"},
            {id:4, title:"Gucci Jackie Soft", price:185000, img:"https://picsum.photos/id/133/600/600"}
        ];

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card bg-zinc-900 rounded-3xl overflow-hidden shadow-lg';
                card.innerHTML = `
                    <img src="${p.img}" class="w-full h-80 object-cover">
                    <div class="p-6">
                        <h3 class="font-semibold text-lg text-zinc-100">${p.title}</h3>
                        <p class="text-2xl gold mt-4 font-bold">${p.price.toLocaleString('ru-RU')} ₽</p>
                        <button onclick="addToCart(${p.id})" class="mt-6 w-full py-4 bg-white text-black font-semibold rounded-2xl hover:bg-amber-400 transition-colors duration-300">Add to Cart</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            document.getElementById('cart-count').textContent = cart.length;
            alert(`✅ ${product.title} добавлен в корзину`);
            
            if(!document.getElementById('lolo-modal').classList.contains('hidden')) {
                addMessage('lolo', `Отличный выбор, заинька! Лот "${product.title}" уже в корзине. Оформляем?`);
                speak(`Лот добавлен в корзину, заинька.`);
            }
        }

        function toggleCart() {
            alert("Корзина открыта (демо)");
        }

        function toggleLolo() {
            const modal = document.getElementById('lolo-modal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden') && document.getElementById('lolo-chat').children.length === 0) {
                addMessage('lolo', 'Привет в нашем преданном бутике, заинька! Я твоя живая Лола. Все категории и роскошные сумки на месте. О чем поговорим сегодня с нашей бандой?');
            }
        }

        function addMessage(sender, text) {
            const chat = document.getElementById('lolo-chat');
            const msg = document.createElement('div');
            msg.className = sender === 'user' ? 'text-right' : 'text-left';
            msg.innerHTML = `
                <div class="inline-block max-w-[85%] px-5 py-3 rounded-3xl text-sm ${sender === 'user' ? 'bg-amber-400 text-black font-medium' : 'bg-zinc-800 text-zinc-100 border border-zinc-700'}">
                    ${text}
                </div>
            `;
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        }

        async function callGemini(promptText) {
            const key = document.getElementById('gemini-key').value.trim();
            if (key) {
                GEMINI_API_KEY = key;
                localStorage.setItem('gemini_key', key);
            }

            if (!GEMINI_API_KEY) return "Пожалуйста, вставьте ваш Gemini API Key в поле сверху, заинька.";

            const fullPrompt = `${loloContext}\n\nПользователь говорит: "${promptText}"\nЛола отвечает:`;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: fullPrompt }] }]
                    })
                });
                const data = await res.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    return data.candidates[0].content.parts[0].text;
                } else {
                    return "Не смогла распознать запрос, заинька. Проверь, правильно ли скопирован ключ.";
                }
            } catch (err) {
                console.error(err);
                return "Ошибка связи с Gemini API. Браузер блокирует прямой запрос. Но скоро подключим Python и всё будет летать!";
            }
        }

        async function processUserInput(text) {
            if(!text.trim()) return;
            addMessage('user', text);
            
            const thinking = document.createElement('div');
            thinking.id = 'lolo-thinking';
            thinking.textContent = 'Лоло думает...';
            thinking.className = 'text-purple-400 text-xs animate-pulse pl-2';
            document.getElementById('lolo-chat').appendChild(thinking);

            const reply = await callGemini(text);
            document.getElementById('lolo-thinking')?.remove();
            
            addMessage('lolo', reply);
            speak(reply);
        }

        function sendTextMessage() {
            const text = prompt("Сообщение Лоло:");
            if (text) processUserInput(text);
        }

        function startVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("Ваш браузер не поддерживает голосовой ввод.");

            const rec = new SpeechRecognition();
            rec.lang = 'ru-RU';
            rec.onstart = () => { addMessage('lolo', 'Слушаю тебя внимательно, заинька...'); };
            rec.onresult = (e) => processUserInput(e.results[0][0].transcript);
            rec.start();
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = text.match(/[а-яієґуоыё]/i) ? 'ru-RU' : 'en-US';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        window.onload = () => {
            renderProducts();
            if (GEMINI_API_KEY) document.getElementById('gemini-key').value = GEMINI_API_KEY;
        };
    </script>
</body>
</html>
